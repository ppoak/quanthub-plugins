[project]
name = "factor-research"
version = "0.1.0"
description = "Factor research skills and their local Python dependencies."
requires-python = ">=3.12"
dependencies = [
  "factor-protocol>=0.0.0",
  "factor-compose>=0.0.0",
  "matplotlib>=3.9.0",
]

[tool.uv]
package = false

[tool.uv.sources]
factor-protocol = { path = "skills/factor-protocol", editable = true }
factor-compose = { path = "skills/factor-compose", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = []
