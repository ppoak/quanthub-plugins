[project]
name = "factor-protocol"
version = "0.0.0"
description = "Stable factor package contracts and DuckDB Hive Parquet storage."
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0.0", "numpy>=2.0.0", "pandas>=2.2.0", "pyarrow>=16.0.0", "pyyaml>=6.0.0"]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
include = ["factor_protocol*"]
