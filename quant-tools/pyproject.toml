[project]
name = "quant-tools"
version = "0.1.0"
description = "Local scripts for quantitative data maintenance and report downloads."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[dependency-groups]
ricequant = ["numpy>=2.0.0", "joblib", "rqdatac", "selenium>=4.44.0", "tqdm"]
backup = ["huggingface-hub>=0.33.0", "hf-xet>=1.5.2"]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = []
