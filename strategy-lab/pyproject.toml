[project]
name = "strategy-lab"
version = "0.1.0"
description = "Strategy framework, local A-share backtests and EastMoney portfolio adapters."
requires-python = ">=3.12"
dependencies = [
  "base-strategy>=0.1.0",
  "ashare-backtest-strategy>=0.1.0",
  "eastmoney-strategy>=0.1.0",
]

[dependency-groups]
excel = ["openpyxl>=3.1.0"]

[tool.uv]
package = false
default-groups = []

[tool.uv.sources]
base-strategy = { path = "skills/base-strategy", editable = true }
ashare-backtest-strategy = { path = "skills/ashare-backtest-strategy", editable = true }
eastmoney-strategy = { path = "skills/eastmoney-strategy", editable = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = []
